{allow, {user, "development-ingestion"}, subscribe, ["algaguard/v1/devices/#"]}.
{allow, {user, "development-ingestion"}, publish, ["algaguard/v1/devices/+/telemetry/ack"]}.
{allow, {user, "development-command"}, publish, ["algaguard/v1/devices/+/commands"]}.
{allow, {user, "development-command"}, subscribe, ["algaguard/v1/devices/#"]}.
{allow, {user, "development-device-harness"}, publish, ["algaguard/v1/devices/+/telemetry", "algaguard/v1/devices/+/status", "algaguard/v1/devices/+/command-results"]}.
{allow, {user, "development-device-harness"}, subscribe, ["algaguard/v1/devices/+/telemetry/ack", "algaguard/v1/devices/+/commands", "algaguard/v1/devices/+/configuration", "algaguard/v1/devices/+/ota"]}.
{allow, {clientid, {re, "^AG-[0-9]{6}$"}}, publish, ["algaguard/v1/devices/${clientid}/telemetry", "algaguard/v1/devices/${clientid}/status", "algaguard/v1/devices/${clientid}/command-results"]}.
{allow, {clientid, {re, "^AG-[0-9]{6}$"}}, subscribe, ["algaguard/v1/devices/${clientid}/telemetry/ack", "algaguard/v1/devices/${clientid}/commands", "algaguard/v1/devices/${clientid}/configuration", "algaguard/v1/devices/${clientid}/ota"]}.
{deny, all}.
