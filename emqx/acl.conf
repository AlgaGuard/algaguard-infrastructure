%% Backend service certificates are issued by the separate development service CA.
{allow, {clientid, "algaguard-mqtt-ingestion-service"}, subscribe, ["algaguard/v1/devices/+/telemetry"]}.
{allow, {clientid, "algaguard-mqtt-ingestion-service"}, publish, ["algaguard/v1/devices/+/telemetry/ack"]}.
{allow, {clientid, "algaguard-command-service"}, subscribe, ["algaguard/v1/devices/+/command-results"]}.
{allow, {clientid, "algaguard-command-service"}, publish, ["algaguard/v1/devices/+/commands"]}.
{allow, {clientid, "algaguard-ota-service"}, subscribe, ["algaguard/v1/devices/+/ota/status"]}.
{allow, {clientid, "algaguard-ota-service"}, publish, ["algaguard/v1/devices/+/ota"]}.

%% Device permissions are returned by Device Service during HTTP authentication.
%% A device certificate presented to the protected internal listener has no file grant.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.
{deny, all}.
