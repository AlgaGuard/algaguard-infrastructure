AWSTemplateFormatVersion: '2010-09-09'
Description: AlgaGuard Thursday demo development foundation
Parameters:
  VpcId: {Type: AWS::EC2::VPC::Id}
  SubnetId: {Type: AWS::EC2::Subnet::Id}
  InstanceType: {Type: String, Default: t3.large, AllowedValues: [t3.medium, t3.large]}
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  ExistingSsmRoleName: {Type: String, Default: AlgaGuardDevEc2SsmRole}
Resources:
  DevelopmentKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: AlgaGuard development demo secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - {Key: Project, Value: AlgaGuard}
        - {Key: Environment, Value: Development}
        - {Key: Purpose, Value: ThursdayDemo}
        - {Key: ManagedBy, Value: InfrastructureAsCode}
  DevelopmentKmsAlias:
    Type: AWS::KMS::Alias
    Properties: {AliasName: alias/algaguard-development, TargetKeyId: !Ref DevelopmentKmsKey}
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AlgaGuard development HTTPS only; no SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: ACME and HTTPS redirect}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Trusted HTTPS}
      Tags:
        - {Key: Project, Value: AlgaGuard}
        - {Key: Environment, Value: Development}
        - {Key: Purpose, Value: ThursdayDemo}
        - {Key: ManagedBy, Value: InfrastructureAsCode}
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref ExistingSsmRoleName]}
  InstanceRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AlgaGuardDevelopmentRuntime
      Roles: [!Ref ExistingSsmRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [ecr:GetAuthorizationToken]
            Resource: '*'
          - Effect: Allow
            Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/algaguard/*
          - Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/algaguard/development/*
          - Effect: Allow
            Action: [kms:Decrypt]
            Resource: !GetAtt DevelopmentKmsKey.Arn
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::algaguard-dev-backups-${AWS::AccountId}-${AWS::Region}
              - !Sub arn:${AWS::Partition}:s3:::algaguard-dev-backups-${AWS::AccountId}-${AWS::Region}/*
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {Encrypted: true, VolumeType: gp3, VolumeSize: 50, DeleteOnTermination: true}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-x86_64 \
            --output /usr/local/lib/docker/cli-plugins/docker-compose
          echo '33b208d7e76639db742fae84b966cc01dacae58ca3fc4dabbc907045aefdf0c4  /usr/local/lib/docker/cli-plugins/docker-compose' |
            sha256sum --check
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          systemctl enable --now docker amazon-ssm-agent
          systemctl disable --now sshd
          mkdir -p /opt/algaguard
          chown ec2-user:ec2-user /opt/algaguard
      Tags:
        - {Key: Project, Value: AlgaGuard}
        - {Key: Environment, Value: Development}
        - {Key: Purpose, Value: ThursdayDemo}
        - {Key: ManagedBy, Value: InfrastructureAsCode}
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - {Key: Project, Value: AlgaGuard}
        - {Key: Environment, Value: Development}
        - {Key: Purpose, Value: ThursdayDemo}
        - {Key: ManagedBy, Value: InfrastructureAsCode}
  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - {Key: Project, Value: AlgaGuard}
        - {Key: Environment, Value: Development}
        - {Key: Purpose, Value: ThursdayDemo}
        - {Key: ManagedBy, Value: InfrastructureAsCode}
  EcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AlgaGuardDevelopmentEcrPush
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProvider}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: >-
                  repo:AlgaGuard@305754636/algaguard-infrastructure@1309235705:environment:development
      Policies:
        - PolicyName: PushAlgaGuardImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ecr:GetAuthorizationToken], Resource: '*'}
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/algaguard/*
      Tags:
        - {Key: Project, Value: AlgaGuard}
        - {Key: Environment, Value: Development}
        - {Key: Purpose, Value: ThursdayDemo}
        - {Key: ManagedBy, Value: InfrastructureAsCode}
  SsmDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AlgaGuardDevelopmentSsmDeploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProvider}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: >-
                  repo:AlgaGuard@305754636/algaguard-infrastructure@1309235705:environment:development
      Policies:
        - PolicyName: DeployTaggedInstance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:SendCommand]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
              - {Effect: Allow, Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations], Resource: '*'}
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::algaguard-dev-backups-${AWS::AccountId}-${AWS::Region}/deployments/*
      Tags:
        - {Key: Project, Value: AlgaGuard}
        - {Key: Environment, Value: Development}
        - {Key: Purpose, Value: ThursdayDemo}
        - {Key: ManagedBy, Value: InfrastructureAsCode}
  ApiGatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/api-gateway
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  AccessServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/access-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  DeviceServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/device-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  ProfileServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/profile-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  TelemetryServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/telemetry-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  MqttIngestionServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/mqtt-ingestion-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  CommandServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/command-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  OtaServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/ota-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  WebDashboardRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/web-dashboard
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
  RealtimeServiceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: algaguard/realtime-service
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"retain 10",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan",
          "countNumber":10},"action":{"type":"expire"}}]}
Outputs:
  InstanceId: {Value: !Ref Instance}
  ElasticIp: {Value: !Ref ElasticIp}
  EcrPushRoleArn: {Value: !GetAtt EcrPushRole.Arn}
  SsmDeployRoleArn: {Value: !GetAtt SsmDeployRole.Arn}
  DevelopmentKmsKeyArn: {Value: !GetAtt DevelopmentKmsKey.Arn}
