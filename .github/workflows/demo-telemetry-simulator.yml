name: Development demo telemetry simulator

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bounded simulator control action
        required: true
        default: status
        type: choice
        options: [status, start, stop]
      infrastructure_sha:
        description: Exact algaguard-infrastructure develop SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.infrastructure_sha }}
      - name: Verify exact branch head and action
        env:
          GH_TOKEN: ${{ github.token }}
          INFRA_SHA: ${{ inputs.infrastructure_sha }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          test "${#INFRA_SHA}" -eq 40
          actual=$(gh api repos/AlgaGuard/algaguard-infrastructure/git/ref/heads/develop --jq .object.sha)
          test "$actual" = "$INFRA_SHA"
          case "$ACTION" in status|start|stop) ;; *) exit 2 ;; esac
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEVELOPMENT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Apply protected simulator control through SSM
        env:
          ACTION: ${{ inputs.action }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command="/opt/algaguard/current/scripts/set-demo-telemetry-simulator.sh $ACTION"
          jq -n --arg command "$command" '{commands:["set -eu", $command]}' >ssm-parameters.json
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "AlgaGuard protected development demo simulator control" \
            --parameters file://ssm-parameters.json \
            --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || printf Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          output=$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)
          printf '%s\n' "$output" | grep -E '^DEMO_SIMULATOR_(DISABLED|RUNNING|STOPPED|FAILED)$'
          test "$status" = Success
