name: Development QR onboarding control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bounded QR onboarding control action
        required: true
        default: status
        type: choice
        options: [status, enable, disable]
      infrastructure_sha:
        description: Exact algaguard-infrastructure develop SHA
        required: true
        type: string
      window_seconds:
        description: Automatic disable window for enable
        required: true
        default: '900'
        type: choice
        options: ['600', '900']

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.infrastructure_sha }}
      - name: Verify exact develop head
        env:
          GH_TOKEN: ${{ github.token }}
          INFRA_SHA: ${{ inputs.infrastructure_sha }}
          ACTION: ${{ inputs.action }}
          WINDOW_SECONDS: ${{ inputs.window_seconds }}
        run: |
          set -euo pipefail
          test "${#INFRA_SHA}" -eq 40
          test "$(gh api repos/AlgaGuard/algaguard-infrastructure/git/ref/heads/develop --jq .object.sha)" = "$INFRA_SHA"
          case "$ACTION" in status|enable|disable) ;; *) exit 2 ;; esac
          case "$WINDOW_SECONDS" in 600|900) ;; *) exit 2 ;; esac
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEVELOPMENT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Apply QR control through SSM
        env:
          ACTION: ${{ inputs.action }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          WINDOW_SECONDS: ${{ inputs.window_seconds }}
        run: |
          set -euo pipefail
          command="/opt/algaguard/current/scripts/set-qr-onboarding.sh $ACTION $WINDOW_SECONDS"
          jq -n --arg command "$command" '{commands:["set -eu", $command]}' >ssm-parameters.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment 'AlgaGuard protected QR onboarding control' --parameters file://ssm-parameters.json \
            --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || printf Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          output=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text)
          printf '%s\n' "$output" | grep -E '^QR_ONBOARDING_(ENABLED|DISABLED)$'
          test "$status" = Success
