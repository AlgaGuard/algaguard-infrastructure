x-node-service: &node-service
  restart: unless-stopped
  user: "${ALGAGUARD_RUNTIME_UID:-1000}:${ALGAGUARD_RUNTIME_GID:-1000}"
  environment: &node-environment
    NODE_ENV: development
    PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379
    LOG_LEVEL: info
    KEYCLOAK_ISSUER: ${PUBLIC_KEYCLOAK_URL}/realms/algaguard
    KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/algaguard/protocol/openid-connect/certs
    KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/algaguard/protocol/openid-connect/token
    KEYCLOAK_AUDIENCE: algaguard-api
  depends_on: &node-dependencies
    timescaledb:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck: &node-healthcheck
    test:
      ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 20
  networks: [backend]

services:
  access-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-access-service
    command:
      [
        "sh",
        "-c",
        "node dist/scripts/migrate.js && exec node dist/src/index.js",
      ]
    environment:
      <<: *node-environment
      SERVICE_CLIENT_ID: algaguard-access-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_ACCESS_SERVICE_SECRET}
      SERVICE_CLIENT_IDS: >-
        algaguard-device-service,algaguard-realtime-service,
        algaguard-telemetry-service,algaguard-profile-service,
        algaguard-command-service,algaguard-ota-service
      DEVICE_SERVICE_URL: http://device-service:3000
    ports: ["127.0.0.1:3001:3000"]

  device-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-device-service
    command:
      [
        "sh",
        "-c",
        "node dist/scripts/migrate.js && exec node dist/src/index.js",
      ]
    environment:
      <<: *node-environment
      ACCESS_SERVICE_URL: http://access-service:3000
      ALLOW_DEVELOPMENT_CREDENTIALS: "false"
      ALGAGUARD_ENABLE_OWNED_DEVICE_BOOTSTRAP_REISSUE: ${ALGAGUARD_ENABLE_OWNED_DEVICE_BOOTSTRAP_REISSUE:-0}
      ALGAGUARD_ENABLE_QR_ONBOARDING: ${ALGAGUARD_ENABLE_QR_ONBOARDING:-0}
      QR_ONBOARDING_SIGNING_PRIVATE_KEY_PKCS8: ${QR_ONBOARDING_SIGNING_PRIVATE_KEY_PKCS8:-}
      HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT}
      DEVICE_CA_PROVIDER: local-development
      DEVICE_CA_CERTIFICATE_PATH: /run/algaguard-pki/device-ca/ca.crt
      DEVICE_CA_PRIVATE_KEY_PATH: /run/algaguard-pki/device-ca/ca.key
      DEVICE_CERTIFICATE_VALIDITY_DAYS: ${DEVICE_CERTIFICATE_VALIDITY_DAYS}
      DEVICE_BOOTSTRAP_TTL_SECONDS: ${DEVICE_BOOTSTRAP_TTL_SECONDS}
      DEVICE_BOOTSTRAP_MAX_ATTEMPTS: ${DEVICE_BOOTSTRAP_MAX_ATTEMPTS}
      DEVICE_ROTATION_OVERLAP_SECONDS: ${DEVICE_ROTATION_OVERLAP_SECONDS}
      DEVICE_BROKER_HOST: ${PUBLIC_MQTT_HOST:-localhost}
      DEVICE_BROKER_PORT: ${PUBLIC_MQTT_PORT:-8883}
      DEVICE_BROKER_SERVER_NAME: ${PUBLIC_MQTT_HOST:-localhost}
      DEVICE_BROKER_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS}
      DEVICE_BROKER_SESSION_EXPIRY_SECONDS: ${MQTT_SESSION_EXPIRY_SECONDS}
      DEVICE_BROKER_AUTH_CACHE_SECONDS: ${DEVICE_BROKER_AUTH_CACHE_SECONDS}
      DEVICE_REVOCATION_EFFECTIVE_SECONDS: ${DEVICE_REVOCATION_EFFECTIVE_SECONDS}
      BROKER_DEVICE_AUTH_TOKEN: ${BROKER_DEVICE_AUTH_TOKEN}
      SERVICE_CLIENT_ID: algaguard-device-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_DEVICE_SERVICE_SECRET}
      SERVICE_CLIENT_IDS: algaguard-access-service,algaguard-mqtt-ingestion-service,algaguard-telemetry-service,algaguard-ota-service
      REALTIME_SERVICE_URL: http://realtime-service:3000
    ports: ["127.0.0.1:3002:3000"]
    volumes:
      - ./.local/pki:/run/algaguard-pki:ro
    depends_on:
      <<: *node-dependencies
      access-service:
        condition: service_healthy

  demo-telemetry-simulator:
    <<: *node-service
    profiles: [demo-simulator]
    command: ["node", "dist/src/demo-telemetry-worker.js"]
    environment:
      <<: *node-environment
      ALGAGUARD_ENABLE_DEMO_TELEMETRY_SIMULATOR: ${ALGAGUARD_ENABLE_DEMO_TELEMETRY_SIMULATOR:-0}
      TELEMETRY_SERVICE_URL: http://telemetry-service:3000
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/algaguard/protocol/openid-connect/token
      SERVICE_CLIENT_ID: algaguard-mqtt-ingestion-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_MQTT_INGESTION_SERVICE_SECRET}
    restart: unless-stopped
    depends_on:
      <<: *node-dependencies
      keycloak:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
    ports: []
    healthcheck:
      disable: true

  profile-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-profile-service
    command:
      [
        "sh",
        "-c",
        "node dist/scripts/migrate.js && exec node dist/src/index.js",
      ]
    environment:
      <<: *node-environment
      ACCESS_SERVICE_URL: http://access-service:3000
      SERVICE_CLIENT_ID: algaguard-profile-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_PROFILE_SERVICE_SECRET}
      ALERT_PROCESSOR_CLIENT_ID: algaguard-realtime-service
    ports: ["127.0.0.1:3003:3000"]
    depends_on:
      <<: *node-dependencies
      access-service:
        condition: service_healthy

  telemetry-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-telemetry-service
    command:
      [
        "sh",
        "-c",
        "node dist/scripts/migrate.js && exec node dist/src/index.js",
      ]
    environment:
      <<: *node-environment
      ACCESS_SERVICE_URL: http://access-service:3000
      DEVICE_SERVICE_URL: http://device-service:3000
      SERVICE_CLIENT_ID: algaguard-telemetry-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_TELEMETRY_SERVICE_SECRET}
      SERVICE_CLIENT_IDS: algaguard-mqtt-ingestion-service
    ports: ["127.0.0.1:3005:3000"]
    depends_on:
      <<: *node-dependencies
      access-service:
        condition: service_healthy
      device-service:
        condition: service_healthy

  mqtt-ingestion-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-mqtt-ingestion-service
    command:
      [
        "sh",
        "-c",
        "node dist/scripts/migrate.js && exec node dist/src/index.js",
      ]
    environment:
      <<: *node-environment
      HTTP_BODY_LIMIT: ${HTTP_BODY_LIMIT}
      MQTT_URL: mqtts://emqx:8884
      MQTT_CLIENT_ID: algaguard-mqtt-ingestion-service
      MQTT_CA_PATH: /run/algaguard-pki/device-ca/ca.crt
      MQTT_CERTIFICATE_PATH: /run/algaguard-pki/services/algaguard-mqtt-ingestion-service/tls.crt
      MQTT_PRIVATE_KEY_PATH: /run/algaguard-pki/services/algaguard-mqtt-ingestion-service/tls.key
      MQTT_SERVER_NAME: emqx
      MQTT_MAX_PACKET_BYTES: ${MQTT_MAX_PACKET_BYTES}
      MQTT_MAX_SAMPLES_PER_BATCH: ${MQTT_MAX_SAMPLES_PER_BATCH}
      MQTT_QOS1_INFLIGHT: ${MQTT_QOS1_INFLIGHT}
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS}
      MQTT_SESSION_EXPIRY_SECONDS: ${MQTT_SESSION_EXPIRY_SECONDS}
      MQTT_RECONNECT_DELAY_MS: ${MQTT_RECONNECT_DELAY_MS}
      MQTT_MAX_MESSAGES_PER_SECOND: ${MQTT_MAX_MESSAGES_PER_SECOND}
      TELEMETRY_SERVICE_URL: http://telemetry-service:3000
      DEVICE_SERVICE_URL: http://device-service:3000
      SERVICE_CLIENT_ID: algaguard-mqtt-ingestion-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_MQTT_INGESTION_SERVICE_SECRET}
    ports: ["127.0.0.1:3004:3000"]
    volumes:
      - ./.local/pki:/run/algaguard-pki:ro
    depends_on:
      <<: *node-dependencies
      emqx:
        condition: service_healthy
      access-service:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
      device-service:
        condition: service_healthy

  command-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-command-service
    command:
      [
        "sh",
        "-c",
        "node dist/scripts/migrate.js && exec node dist/src/index.js",
      ]
    environment:
      <<: *node-environment
      MQTT_URL: mqtts://emqx:8884
      MQTT_CLIENT_ID: algaguard-command-service
      MQTT_CA_PATH: /run/algaguard-pki/device-ca/ca.crt
      MQTT_CERTIFICATE_PATH: /run/algaguard-pki/services/algaguard-command-service/tls.crt
      MQTT_PRIVATE_KEY_PATH: /run/algaguard-pki/services/algaguard-command-service/tls.key
      MQTT_SERVER_NAME: emqx
      MQTT_QOS1_INFLIGHT: ${MQTT_QOS1_INFLIGHT}
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS}
      MQTT_SESSION_EXPIRY_SECONDS: ${MQTT_SESSION_EXPIRY_SECONDS}
      MQTT_RECONNECT_DELAY_MS: ${MQTT_RECONNECT_DELAY_MS}
      ACCESS_SERVICE_URL: http://access-service:3000
      SERVICE_CLIENT_ID: algaguard-command-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_COMMAND_SERVICE_SECRET}
    ports: ["127.0.0.1:3006:3000"]
    volumes:
      - ./.local/pki:/run/algaguard-pki:ro
    depends_on:
      <<: *node-dependencies
      emqx:
        condition: service_healthy
      access-service:
        condition: service_healthy

  ota-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-ota-service
    command:
      [
        "sh",
        "-c",
        "node dist/scripts/migrate.js && exec node dist/src/index.js",
      ]
    environment:
      <<: *node-environment
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: algaguard-ota-development
      MQTT_URL: mqtts://emqx:8884
      MQTT_CLIENT_ID: algaguard-ota-service
      MQTT_CA_PATH: /run/algaguard-pki/device-ca/ca.crt
      MQTT_CERTIFICATE_PATH: /run/algaguard-pki/services/algaguard-ota-service/tls.crt
      MQTT_PRIVATE_KEY_PATH: /run/algaguard-pki/services/algaguard-ota-service/tls.key
      MQTT_SERVER_NAME: emqx
      MQTT_QOS1_INFLIGHT: ${MQTT_QOS1_INFLIGHT}
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS}
      MQTT_SESSION_EXPIRY_SECONDS: ${MQTT_SESSION_EXPIRY_SECONDS}
      MQTT_RECONNECT_DELAY_MS: ${MQTT_RECONNECT_DELAY_MS}
      HTTP_BODY_LIMIT_BYTES: ${OTA_HTTP_BODY_LIMIT_BYTES}
      OTA_ASSIGNMENT_TTL_SECONDS: ${OTA_ASSIGNMENT_TTL_SECONDS}
      OTA_DOWNLOAD_URL_TTL_SECONDS: ${OTA_DOWNLOAD_URL_TTL_SECONDS}
      OTA_SIGNING_PUBLIC_KEY_PATH: /run/algaguard-pki/ota-signing/signing-public.pem
      ACCESS_SERVICE_URL: http://access-service:3000
      DEVICE_SERVICE_URL: http://device-service:3000
      SERVICE_CLIENT_IDS: algaguard-firmware-release,algaguard-mqtt-ingestion-service
      SERVICE_CLIENT_ID: algaguard-ota-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_OTA_SERVICE_SECRET}
    ports: ["127.0.0.1:3007:3000"]
    volumes:
      - ./.local/pki:/run/algaguard-pki:ro
    depends_on:
      <<: *node-dependencies
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
      access-service:
        condition: service_healthy
      device-service:
        condition: service_healthy

  realtime-service:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-realtime-service
    environment:
      <<: *node-environment
      ACCESS_SERVICE_URL: http://access-service:3000
      PROFILE_SERVICE_URL: http://profile-service:3000
      SERVICE_CLIENT_ID: algaguard-realtime-service
      SERVICE_CLIENT_SECRET: ${ALGAGUARD_REALTIME_SERVICE_SECRET}
      SERVICE_CLIENT_IDS: algaguard-device-service
      ALGAGUARD_ENABLE_FCM: ${ALGAGUARD_ENABLE_FCM:-0}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY_PKCS8_BASE64: ${FCM_PRIVATE_KEY_PKCS8_BASE64:-}
      FCM_TOKEN_WRAPPING_KEY_BASE64: ${FCM_TOKEN_WRAPPING_KEY_BASE64:-}
      HTTP_BODY_LIMIT_BYTES: ${REALTIME_HTTP_BODY_LIMIT_BYTES}
      WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES}
      WS_MAX_SUBSCRIPTIONS: ${WS_MAX_SUBSCRIPTIONS}
      WS_OUTBOUND_QUEUE_MAX: ${WS_OUTBOUND_QUEUE_MAX}
      WS_CONNECTIONS_PER_MINUTE: ${WS_CONNECTIONS_PER_MINUTE}
      WS_MESSAGES_PER_MINUTE: ${WS_MESSAGES_PER_MINUTE}
      WS_HEARTBEAT_MS: ${WS_HEARTBEAT_MS}
      WS_IDLE_TIMEOUT_MS: ${WS_IDLE_TIMEOUT_MS}
      WS_BACKPRESSURE_BYTES: ${WS_BACKPRESSURE_BYTES}
      WS_PREAUTH_BUFFER_MESSAGES: ${WS_PREAUTH_BUFFER_MESSAGES}
    ports: ["127.0.0.1:3008:3000"]
    depends_on:
      <<: *node-dependencies
      access-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy

  api-gateway:
    <<: *node-service
    build: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-api-gateway
    environment:
      <<: *node-environment
      KEYCLOAK_ISSUER: ${PUBLIC_KEYCLOAK_URL}/realms/algaguard
      KEYCLOAK_AUDIENCE: algaguard-api
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      <<: *node-dependencies
      keycloak:
        condition: service_healthy
      access-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
      command-service:
        condition: service_healthy
      ota-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy

  web-dashboard:
    build:
      context: ${ALGAGUARD_REPOS_ROOT:-..}/algaguard-web-dashboard
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL}/v1
        VITE_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL}
        VITE_WEBSOCKET_URL: ${PUBLIC_WSS_URL}
    restart: unless-stopped
    ports: ["127.0.0.1:5173:80"]
    networks: [backend]
