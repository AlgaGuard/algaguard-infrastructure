events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status}';
  access_log /var/log/nginx/access.log json;
  resolver 127.0.0.11 valid=30s;
  server {
    listen 80;
    location = /health { add_header Content-Type application/json; return 200 '{"status":"UP"}'; }
    location / { return 308 https://$host:8443$request_uri; }
  }
  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/pki/gateway/tls.crt;
    ssl_certificate_key /etc/nginx/pki/gateway/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    proxy_read_timeout 90s;
    location = /health { add_header Content-Type application/json; return 200 '{"status":"UP"}'; }
    location /auth/ {
      # No trailing slash: keeps the /auth prefix on the forwarded request,
      # matching Keycloak's KC_HTTP_RELATIVE_PATH=/auth below.
      proxy_pass http://keycloak:8080;
      proxy_set_header X-Request-ID $request_id;
      # Keycloak's KC_HOSTNAME_BACKCHANNEL_DYNAMIC resolves token_endpoint /
      # jwks_uri from these forwarded headers per-request; without them it
      # falls back to its own plain-http listener address, and native OIDC
      # clients (e.g. AppAuth on Android) hard-reject a non-https token
      # endpoint. Mirrors the auth.algaguard.bosilu.dev block in
      # nginx.cloud.conf, adjusted for the local path-based :8443 layout.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 8443;
    }
    location /minio/ { proxy_pass http://minio:9000/; proxy_set_header X-Request-ID $request_id; }
    location /grafana/ { proxy_pass http://grafana:3000/; proxy_set_header X-Request-ID $request_id; }
    location /api/ {
      set $api_upstream http://api-gateway:3000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api_upstream;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_set_header Authorization $http_authorization;
    }
    location /realtime {
      set $realtime_upstream http://realtime-service:3000;
      proxy_pass $realtime_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Correlation-ID $request_id;
    }
    location / {
      set $web_upstream http://web-dashboard:80;
      proxy_pass $web_upstream;
      proxy_set_header X-Correlation-ID $request_id;
    }
  }
}
