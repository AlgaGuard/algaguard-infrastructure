events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  map $http_origin $dashboard_cors_origin {
    default "";
    "https://algaguard.bosilu.dev" $http_origin;
  }
  limit_req_zone $binary_remote_addr zone=physical_session_handoff:1m rate=15r/m;
  log_format safe escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status}';
  access_log /var/log/nginx/access.log safe;
  resolver 127.0.0.11 valid=30s;
  server_tokens off;

  # Container-local liveness only. This listener is not published by Compose.
  server {
    listen 127.0.0.1:8081;
    server_name _;
    location = /health { return 200; }
  }

  server {
    listen 80;
    server_name algaguard.bosilu.dev api.algaguard.bosilu.dev auth.algaguard.bosilu.dev realtime.algaguard.bosilu.dev;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /etc/nginx/pki/live/algaguard.bosilu.dev/fullchain.pem;
  ssl_certificate_key /etc/nginx/pki/live/algaguard.bosilu.dev/privkey.pem;
  client_max_body_size 256k;
  proxy_read_timeout 90s;

  server {
    listen 443 ssl;
    server_name algaguard.bosilu.dev;
    location = /health { add_header Content-Type application/json; return 200 '{"status":"UP"}'; }
    location = /auth/callback {
      proxy_pass http://web-dashboard:80/;
      proxy_set_header X-Correlation-ID $request_id;
    }
    location / {
      proxy_intercept_errors on;
      error_page 404 = @web_spa;
      proxy_pass http://web-dashboard:80;
      proxy_set_header X-Correlation-ID $request_id;
    }
    location @web_spa {
      rewrite ^ / break;
      proxy_pass http://web-dashboard:80;
      proxy_set_header X-Correlation-ID $request_id;
    }
  }

  server {
    listen 443 ssl;
    server_name api.algaguard.bosilu.dev;
    location = /health { proxy_pass http://api-gateway:3000/health/ready; }
    # Development-only device-code endpoints. The Device Service registers
    # these routes only while its guarded handoff feature is explicitly active.
    location = /v1/development/physical-session-handoffs/start {
      limit_except POST { deny all; }
      limit_req zone=physical_session_handoff burst=2 nodelay;
      proxy_pass http://device-service:3000;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_set_header Authorization "";
    }
    location = /v1/development/physical-session-handoffs/redeem {
      limit_except POST { deny all; }
      limit_req zone=physical_session_handoff burst=2 nodelay;
      proxy_pass http://device-service:3000;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_set_header Authorization "";
    }
    # The firmware bootstrap exchange authenticates with its one-time session
    # body, while certificate issuance uses the short-lived bootstrap bearer.
    # Keep both routes exact so no broader Device Service surface is exposed.
    location = /services/device/device-credential-bootstrap/exchange {
      limit_except POST { deny all; }
      limit_req zone=physical_session_handoff burst=2 nodelay;
      proxy_pass http://device-service:3000/v1/device-credential-bootstrap/exchange;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_set_header Authorization "";
    }
    location = /services/device/device-credential-bootstrap/issue {
      limit_except POST { deny all; }
      limit_req zone=physical_session_handoff burst=2 nodelay;
      proxy_pass http://device-service:3000/v1/device-credential-bootstrap/issue;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_set_header Authorization $http_authorization;
    }
    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $dashboard_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Correlation-ID" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        return 204;
      }
      add_header Access-Control-Allow-Origin $dashboard_cors_origin always;
      add_header Vary Origin always;
      proxy_pass http://api-gateway:3000;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_set_header Authorization $http_authorization;
    }
  }

  server {
    listen 443 ssl;
    server_name auth.algaguard.bosilu.dev;
    location / {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Request-ID $request_id;
    }
  }

  server {
    listen 443 ssl;
    server_name realtime.algaguard.bosilu.dev;
    location = /health { proxy_pass http://realtime-service:3000/health/ready; }
    location / {
      proxy_pass http://realtime-service:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Correlation-ID $request_id;
    }
  }
}
