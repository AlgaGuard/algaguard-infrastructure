events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  log_format safe escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status}';
  access_log /var/log/nginx/access.log safe;
  resolver 127.0.0.11 valid=30s;
  server_tokens off;

  server {
    listen 80;
    server_name algaguard.bosilu.dev api.algaguard.bosilu.dev auth.algaguard.bosilu.dev realtime.algaguard.bosilu.dev;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /etc/nginx/pki/live/algaguard.bosilu.dev/fullchain.pem;
  ssl_certificate_key /etc/nginx/pki/live/algaguard.bosilu.dev/privkey.pem;
  client_max_body_size 256k;
  proxy_read_timeout 90s;

  server {
    listen 443 ssl;
    server_name algaguard.bosilu.dev;
    location = /health { add_header Content-Type application/json; return 200 '{"status":"UP"}'; }
    location / {
      proxy_pass http://web-dashboard:80;
      proxy_set_header X-Correlation-ID $request_id;
    }
  }

  server {
    listen 443 ssl;
    server_name api.algaguard.bosilu.dev;
    location = /health { proxy_pass http://api-gateway:3000/health/ready; }
    location / {
      proxy_pass http://api-gateway:3000;
      proxy_set_header X-Correlation-ID $request_id;
      proxy_set_header Authorization $http_authorization;
    }
  }

  server {
    listen 443 ssl;
    server_name auth.algaguard.bosilu.dev;
    location / {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Request-ID $request_id;
    }
  }

  server {
    listen 443 ssl;
    server_name realtime.algaguard.bosilu.dev;
    location = /health { proxy_pass http://realtime-service:3000/health/ready; }
    location / {
      proxy_pass http://realtime-service:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Correlation-ID $request_id;
    }
  }
}
