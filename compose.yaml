name: ${COMPOSE_PROJECT_NAME:-algaguard}

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: [start-dev, --import-realm, --health-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://timescaledb:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      # Local dev serves Keycloak under a path prefix (nginx /auth/); without
      # telling Keycloak its own relative path, KC_HOSTNAME_BACKCHANNEL_DYNAMIC
      # reconstructs token_endpoint/jwks_uri without the /auth prefix, which
      # 404s (or gets misrouted) through nginx. Production uses a dedicated
      # subdomain with no prefix, so this stays "/" (Keycloak's own default)
      # there since KEYCLOAK_RELATIVE_PATH is never set in that environment.
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_RELATIVE_PATH:-/}
      ALGAGUARD_ACCESS_SERVICE_SECRET: ${ALGAGUARD_ACCESS_SERVICE_SECRET}
      ALGAGUARD_DEVICE_SERVICE_SECRET: ${ALGAGUARD_DEVICE_SERVICE_SECRET}
      ALGAGUARD_MQTT_INGESTION_SERVICE_SECRET: ${ALGAGUARD_MQTT_INGESTION_SERVICE_SECRET}
      ALGAGUARD_TELEMETRY_SERVICE_SECRET: ${ALGAGUARD_TELEMETRY_SERVICE_SECRET}
      ALGAGUARD_REALTIME_SERVICE_SECRET: ${ALGAGUARD_REALTIME_SERVICE_SECRET}
      ALGAGUARD_PROFILE_SERVICE_SECRET: ${ALGAGUARD_PROFILE_SERVICE_SECRET}
      ALGAGUARD_COMMAND_SERVICE_SECRET: ${ALGAGUARD_COMMAND_SERVICE_SECRET}
      ALGAGUARD_OTA_SERVICE_SECRET: ${ALGAGUARD_OTA_SERVICE_SECRET}
      ALGAGUARD_FIRMWARE_RELEASE_SECRET: ${ALGAGUARD_FIRMWARE_RELEASE_SECRET}
    volumes:
      - ./keycloak/algaguard-development-realm.json:/opt/keycloak/data/import/algaguard-realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          echo -e 'GET ${KEYCLOAK_RELATIVE_PATH:-}/health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      # Keycloak may spend several minutes augmenting its image while the
      # development t3.micro is under swap pressure. Do not count those
      # expected startup probes as failures.
      start_period: 600s
    networks: [backend]

  emqx-pki-init:
    image: alpine:3.21
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: [sh, -ec]
    command:
      - |
        mkdir -p /target/device-ca /target/service-ca /target/emqx
        cp /source/device-ca.crt /target/device-ca/ca.crt
        cp /source/service-ca.crt /target/service-ca/ca.crt
        cp /source/emqx.crt /target/emqx/tls.crt
        cp /source/emqx.key /target/emqx/tls.key
        chown -R 1000:1000 /target
        chmod 0755 /target /target/device-ca /target/service-ca /target/emqx
        chmod 0644 /target/device-ca/ca.crt /target/service-ca/ca.crt /target/emqx/tls.crt
        chmod 0600 /target/emqx/tls.key
    volumes:
      - ./.local/pki/device-ca/ca.crt:/source/device-ca.crt:ro
      - ./.local/pki/service-ca/ca.crt:/source/service-ca.crt:ro
      - ./.local/pki/emqx/tls.crt:/source/emqx.crt:ro
      - ./.local/pki/emqx/tls.key:/source/emqx.key:ro
      - emqx-pki:/target

  emqx:
    image: emqx/emqx:5.8
    environment:
      EMQX_NAME: algaguard-emqx
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE}
      EMQX_LISTENERS__SSL__DEVICE__AUTHENTICATION: >-
        [{mechanism = password_based, backend = http, method = post,
        url = "http://device-service:3000/v1/internal/device-credentials/authenticate",
        headers = {"content-type" = "application/json", "authorization" = "Bearer ${BROKER_DEVICE_AUTH_TOKEN}"},
        body = {clientId = "$${clientid}", certificatePem = "$${username}"},
        connect_timeout = 5s, request_timeout = 5s, pool_size = 8, enable = true}]
    volumes:
      - emqx-data:/opt/emqx/data
      - ./emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-pki:/opt/emqx/etc/algaguard-pki:ro
    depends_on:
      emqx-pki-init:
        condition: service_completed_successfully
    ports:
      - "${DEVICE_MQTT_BIND_ADDRESS:-127.0.0.1}:8883:8883"
    healthcheck:
      test: [CMD, /opt/emqx/bin/emqx, ctl, status]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/algaguard-ota-development &&
        mc mb --ignore-existing local/algaguard-backups-development
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.4.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:9090/-/ready]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  loki:
    image: grafana/loki:3.5.1
    command: [-config.file=/etc/loki/local-config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:3100/ready]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  tempo:
    image: grafana/tempo:2.8.1
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:3200/ready]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [backend]

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: [CMD-SHELL, wget --spider -q http://localhost:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ${NGINX_CONFIG_PATH:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${NGINX_TLS_ROOT:-./.local/pki}:/etc/nginx/pki:ro
    ports:
      - "${NGINX_HTTP_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-8443}:443"
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  emqx-data:
  emqx-pki:
  minio-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
